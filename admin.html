<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="manifest" href="admin-manifest.json"><meta name="theme-color" content="#D32F1E"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="admin-icon-192.png"><title>إدارة Taha chef</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4EF;--surface:#fff;--ink:#241C18;--muted:#6E625B;--red:#D32F1E;--gold:#FFC83D;--line:#E6E0D6;--tile:#FFE9B8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120F;--surface:#241C18;--ink:#F6EEE4;--muted:#B5A79C;--line:#3A2F29;--tile:#4A3820}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;line-height:1.6;padding-bottom:90px}
header{background:#231F20;color:#fff;padding:34px 16px 20px;position:relative;display:flex;align-items:center;gap:14px;border-bottom:5px solid var(--red)}
#logo{flex:none;width:84px;height:84px;border-radius:50%;object-fit:cover}
header h1{margin:0;font-size:28px;font-weight:800;line-height:1.2;color:#F6E21B}
header p{margin:6px 0 0;opacity:.92;font-size:15px}
.hours{display:inline-block;margin-top:12px;background:var(--gold);color:#241C18;font-weight:800;font-size:13px;padding:3px 12px;border-radius:99px}
#adminBtn{display:none;position:absolute;top:12px;left:12px;background:#fff;color:var(--red);border:0;border-radius:99px;font:inherit;font-weight:800;font-size:13px;padding:4px 14px;cursor:pointer}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px 14px;border-bottom:1px solid var(--line)}
nav button{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;padding:6px 18px;border-radius:99px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:14px;display:grid;gap:12px}
.card{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;align-items:stretch}
.card.off{opacity:.55}
.pic{min-height:92px}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:10px}
.th{width:56px;height:56px;object-fit:cover;border-radius:8px}
.up{background:var(--ink);color:var(--bg);display:inline-block;font-size:14px;padding:8px 14px}
.pic{flex:none;width:92px;border-radius:10px;background:var(--tile);display:grid;place-items:center;font-size:46px;position:relative}
.badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.info h3{margin:0;font-size:17px;font-weight:800}
.info p{margin:2px 0 6px;color:var(--muted);font-size:13.5px}
.row{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.price{font-weight:800;font-size:17px}
.add,.qty button{border:0;font:inherit;cursor:pointer}
.add{background:var(--red);color:#fff;font-weight:800;padding:5px 18px;border-radius:99px}
.add:disabled{background:var(--muted);cursor:default}
.qty{display:flex;align-items:center;gap:10px;font-weight:800}
.qty button{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:18px;line-height:1}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#bar{position:fixed;inset:auto 0 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:8;display:none}
#bar button{width:100%;background:var(--red);color:#fff;border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:800;font-size:17px;display:flex;justify-content:space-between;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:720px;margin:0 auto;border-radius:20px 20px 0 0;max-height:92%;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 8px;font-size:22px;font-weight:800;display:flex;justify-content:space-between}
.panel h2 button{background:none;border:0;color:var(--muted);font-size:26px;cursor:pointer}
.line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.line span:first-child{flex:1;font-weight:500}
.sug{margin:14px 0 4px;font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chips button{flex:none;border:1.5px dashed var(--red);background:var(--surface);color:var(--ink);font:inherit;padding:6px 14px;border-radius:12px;cursor:pointer}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:19px;margin:14px 0}
input,select,textarea{width:100%;resize:vertical;font:inherit;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);margin-bottom:6px}
#send{display:block;text-align:center;background:#1FA855;color:#fff;font-weight:800;font-size:17px;text-decoration:none;padding:13px;border-radius:14px}
.empty{text-align:center;color:var(--muted);padding:20px}
.ad h4{margin:16px 0 6px;font-size:16px}
.it{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.g{display:flex;gap:6px}.g>*{min-width:0}
.em{flex:0 0 60px;text-align:center}
.ck{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:2px 0 6px}
.ck label{display:flex;align-items:center;gap:5px}
.ck input{width:auto;margin:0}
.btn{border:0;font:inherit;font-weight:800;border-radius:12px;padding:10px 16px;cursor:pointer}
.save{background:#1FA855;color:#fff;width:100%;font-size:17px;padding:13px;margin-top:8px}
.addp{background:var(--ink);color:var(--bg);width:100%}
.del{background:none;color:var(--red);padding:2px 8px}
#msg{margin-top:8px;text-align:center;font-weight:500}

.login{max-width:420px;margin:40px auto;padding:0 18px}
.login h1{color:var(--red);font-size:26px}
body{padding-bottom:30px}
.top{background:#231F20;color:#F6E21B;padding:16px 18px;font-weight:800;font-size:20px;border-bottom:5px solid var(--red)}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.ad h4{margin:16px 0 6px}
</style></head><body>

<script>
var KEY="AIzaSyCCNKUahRRD_0AdDKGSAwgIoYPH80acW6Y", P="taha-chef";
var BASE="https://firestore.googleapis.com/v1/projects/"+P+"/databases/(default)/documents";
var tok=null, creds=null, draft=null, imgs={}, changed={}, nextId=0;
function tfetch(u,o){var c=new AbortController(),t=setTimeout(function(){c.abort()},20000);o=o||{};o.signal=c.signal;return fetch(u,o).finally(function(){clearTimeout(t)})}
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var DEF=JSON.parse($("data").textContent);
function stepOf(x){ if(x.kg===1) return .5; if(x.kg===0) return 1; return x.c==="إضافات"?1:.5; }

function loginView(msg){
  $("app").innerHTML='<div class="login"><h1>تسجيل الدخول</h1><input id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="username"><input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password"><button class="btn save" id="go">دخول</button><div id="msg" role="status">'+(msg||"")+'</div><div style="font-size:11px;color:var(--muted);margin-top:14px">نسخة اللوحة: v5</div></div>';
  try{var se=localStorage.getItem("tc_email"); if(se&&$("em")) $("em").value=se;}catch(x){}
}
async function login(e,p){
  var r=await tfetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+KEY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p,returnSecureToken:true})});
  var j=await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||"ERR");
  tok=j.idToken; creds={e:e,p:p};
}
async function api(method,path,body,retry){
  var r=await tfetch(BASE+path+(path.indexOf("?")<0?"?":"&")+"key="+KEY,{method:method,headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:body?JSON.stringify(body):undefined});
  if((r.status===401||r.status===403)&&!retry&&creds){ await login(creds.e,creds.p); return api(method,path,body,true); }
  return r;
}
async function loadMenu(){
  draft=JSON.parse(JSON.stringify(DEF)); imgs={}; changed={};
  try{
    var r=await api("GET","/menu/main");
    if(r.ok){ var j=await r.json(); var d=JSON.parse(j.fields.json.stringValue); if(d&&d.items){ draft=d; nextId=d.next||0; } }
  }catch(e){ window.__loadFail=1; }
  var need=[]; draft.items.forEach(function(x){ if(x.img===1) need.push(x.id); else if(typeof x.img==="string"){ imgs[x.id]=x.img; x.img=1; } });
  for(var k=0;k<need.length;k+=20){
    var ids=need.slice(k,k+20);
    try{
      var rr=await api("POST",":batchGet",{documents:ids.map(function(i){return "projects/"+P+"/databases/(default)/documents/menu/img_"+i})});
      (await rr.json()).forEach(function(e){ if(e.found){ imgs[e.found.name.split("/img_")[1]]=e.found.fields.d.stringValue; } });
    }catch(e){}
  }
  draft.items.forEach(function(x){ if(!imgs[x.id]) delete x.img; });
}

function render(){

  fld('اسم المتجر','<input data-s="name" value="'+esc(s.name)+'">')+fld('وصف قصير','<input data-s="tagline" value="'+esc(s.tagline)+'">')+fld('ساعات العمل','<input data-s="hours" value="'+esc(s.hours)+'">')+
  '<div class="g">'+fld('رقم واتساب (بصيغة دولية بدون +)','<input data-s="wa" inputmode="numeric" value="'+esc(s.wa)+'">')+fld('العملة','<input data-s="cur" value="'+esc(s.cur)+'">')+'</div>'+
  fld('الأقسام (افصل بينها بفاصلة)','<input id="acats" value="'+esc(draft.cats.join("، "))+'">')+
  '<h4>المنتجات ('+draft.items.length+')</h4><input id="q" placeholder="🔍 ابحث عن منتج" style="margin-bottom:10px"><button class="btn addp" id="aadd">+ إضافة منتج</button><div style="height:10px"></div>';
  draft.items.forEach(function(x,i){

    '<div class="g"><input type="number" min="0" step="any" data-i="'+i+'" data-k="p" value="'+esc(x.p)+'" aria-label="السعر"><select data-i="'+i+'" data-k="c">'+draft.cats.map(function(c){return '<option'+(c===x.c?' selected':'')+'>'+esc(c)+'</option>'}).join("")+'</select></div>'+
    '<div class="ck"><label><input type="checkbox" data-i="'+i+'" data-k="hot"'+(x.hot?' checked':'')+'>الأكثر طلباً</label><label><input type="checkbox" data-i="'+i+'" data-k="sug"'+(x.sug?' checked':'')+'>يُقترح في السلة</label><label><input type="checkbox" data-i="'+i+'" data-k="kg"'+(stepOf(x)===.5?' checked':'')+'>يُباع بالنصف كيلو</label><label><input type="checkbox" data-i="'+i+'" data-k="off"'+(x.off?' checked':'')+'>نفد</label><button class="btn del" data-del="'+i+'">حذف المنتج</button></div></div>';

  h+='<button class="btn save" id="asave">حفظ ونشر للزبائن</button><div id="msg" role="status"></div></div>';
  $("app").innerHTML=h;

function shrink(file,max,q){
  return createImageBitmap(file).then(function(b){
    var sc=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement("canvas");
    c.width=Math.round(b.width*sc);c.height=Math.round(b.height*sc);c.getContext("2d").drawImage(b,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",q);
  });
}
async function upload(t){
  var f=t.files[0]; if(!f) return;

    if(t.dataset.uplogo!==undefined){ draft.shop.logo=await shrink(f,400,.85); }
    else{ var it=draft.items[+t.dataset.up]; imgs[it.id]=await shrink(f,520,.72); changed[it.id]=1; it.img=1; }
    render();
  }catch(e){ $("msg").textContent="تعذّر قراءة الصورة"; }
}
function onEdit(e){
  var t=e.target;
  if(t.dataset.up!==undefined||t.dataset.uplogo!==undefined){ upload(t); return }
  if(t.id==="q"){ var v=t.value.trim(); document.querySelectorAll(".it").forEach(function(el){ el.style.display=(!v||el.dataset.name.indexOf(v)>=0)?"":"none" }); return }
  if(t.id==="acats"){ var cs=t.value.split(/[,،]/).map(function(c){return c.trim()}).filter(Boolean); if(cs.length) draft.cats=cs; return }
  if(t.dataset.s){ draft.shop[t.dataset.s]=t.value; return }
  if(t.dataset.k){ var it=draft.items[+t.dataset.i]; if(t.dataset.k==="kg"){ it.kg=t.checked?1:0 } else if(t.type==="checkbox"){ if(t.checked) it[t.dataset.k]=1; else delete it[t.dataset.k] } else it[t.dataset.k]=t.value; }
}
async function save(){
  var m=$("msg"); m.textContent="جارٍ الحفظ…";
  try{
    var cats=draft.cats; draft.items.forEach(function(x){ if(cats.indexOf(x.c)<0) x.c=cats[0]; x.p=Number(x.p)||0; });
    var ids=Object.keys(changed).filter(function(id){return draft.items.some(function(x){return String(x.id)===id&&imgs[x.id]})});
    for(var k=0;k<ids.length;k++){
      var r=await api("PATCH","/menu/img_"+ids[k],{fields:{d:{stringValue:imgs[ids[k]]}}}); if(!r.ok) throw new Error("img");
    }
    var mx=nextId; draft.items.forEach(function(x){ mx=Math.max(mx,+x.id||0) });
    var out={shop:draft.shop,cats:draft.cats,next:mx,items:draft.items.map(function(x){ var o={id:x.id,n:x.n,d:x.d,p:x.p,c:x.c,e:x.e}; if(x.kg===0||x.kg===1)o.kg=x.kg; if(x.hot)o.hot=1; if(x.sug)o.sug=1; if(x.off)o.off=1; if(imgs[x.id])o.img=1; return o })};
    var r2=await api("PATCH","/menu/main",{fields:{json:{stringValue:JSON.stringify(out)}}});
    if(!r2.ok){ var ej=await r2.json().catch(function(){return {}}); throw new Error((ej.error&&ej.error.message)||"main"); }
    changed={}; nextId=mx; m.textContent="✅ تم الحفظ، والتعديل ظاهر الآن للزبائن";
  }catch(e){ m.textContent="تعذّر الحفظ. تأكد من الاتصال وأن القواعد (Rules) منشورة. ("+e.message+")"; }
}
document.addEventListener("click",async function(e){
  var b=e.target.closest("button"); if(!b) return;
  if(b.id==="go"){
    $("msg").textContent="الخطوة 1 من 2: تسجيل الدخول…";
    try{ await login($("em").value.trim(),$("pw").value); try{localStorage.setItem("tc_email",$("em").value.trim())}catch(x){} $("msg").textContent="الخطوة 2 من 2: تحميل القائمة (قد تستغرق حتى 40 ثانية)…"; await loadMenu(); render(); if(window.__loadFail){ $("msg").textContent="⚠️ تعذّر تحميل القائمة المحفوظة. تأكد من الاتصال قبل الحفظ." } }
    catch(er){ var c=er.message||""; loginView(er.name==="AbortError"||/Failed to fetch|NetworkError|Load failed/i.test(c)?"⚠️ تعذّر الوصول إلى خوادم Google (Firebase) من شبكتك. جرّب شبكة أخرى (واي فاي أو بيانات الهاتف) أو VPN، ثم أعد المحاولة.":/INVALID|NOT_FOUND|PASSWORD/.test(c)?"البريد أو كلمة السر غير صحيحة":/CONFIGURATION/.test(c)?"لم يُفعَّل تسجيل الدخول في Firebase بعد":"تعذّر الدخول ("+esc(c)+")"); }
    return;
  }
  if(!draft) return;
  if(b.dataset.del!==undefined){ draft.items.splice(+b.dataset.del,1); render(); return }
  if(b.dataset.rmimg!==undefined){ var it=draft.items[+b.dataset.rmimg]; delete imgs[it.id]; delete it.img; render(); return }
  if(b.id==="aadd"){ var mx=nextId; draft.items.forEach(function(x){mx=Math.max(mx,+x.id||0)}); nextId=mx+1; draft.items.unshift({id:nextId,n:"منتج جديد",d:"",p:0,c:draft.cats[0],e:"🍗"}); render(); return }
  if(b.id==="asave"){ save(); return }
});
$("app").addEventListener("input",onEdit); $("app").addEventListener("change",onEdit);
window.onerror=function(m){var e=$("msg"); if(e) e.textContent="خطأ في الصفحة: "+m;};
